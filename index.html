<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanik OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script>
    // Preview build: the server runs in this browser. Send API calls to it and wait until it is in control.
    const BASE = new URL('./', location).pathname.replace(/\/$/, ''), realFetch = window.fetch.bind(window);
    window.fetch = (u, o) => realFetch(typeof u === 'string' && (u.startsWith('/api/') || u.startsWith('/gateway/')) ? BASE + u : u, o);
    (async () => {
      if (!('serviceWorker' in navigator)) { document.getElementById('root').textContent = 'This preview needs a browser with service workers.'; return; }
      await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) await new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
      import('./app.js');
    })();
  </script>
</body>
</html>
